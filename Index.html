<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affen Website 🐵</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #1b5e20, #8bc34a);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    img {
      width: 100%;
      border-radius: 15px;
      border: 4px solid green;
    }

    h1 {
      color: green;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: gold;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: orange;
    }

    #text {
      margin-top: 15px;
      font-size: 20px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <img src="affe.jpg" alt="Affe">

    <h1>🐵 Affen Website</h1>
    <p>Der legendäre grinsende Affe!</p>

    <button onclick="banane()">🍌 Banane geben</button>

    <p id="text"></p>
  </div>

  <script>
    function banane() {
      const sprueche = [
        "🍌 Uga Uga!",
        "😂 Der Affe freut sich!",
        "🙈 Mehr Bananen!",
        "🐵 Danke für die Banane!"
      ];

      const zufall = Math.floor(Math.random() * sprueche.length);
      document.getElementById("text").innerText = sprueche[zufall];
    }
  </script>

</body>
</html>
